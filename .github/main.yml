name: Daily Auto Blog Publisher

on:
  schedule:
    # Daily Subah 9:00 AM IST par apne aap chalega
    - cron: '30 3 * * *'
  workflow_dispatch: # Isse aap manually 'Run workflow' button dabakar test kar sakte hain

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Blogger Script
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          TMB_KEY: ${{ secrets.TMB_KEY }}
          BLOG_LANG: "HINDI"
        run: python main.py
